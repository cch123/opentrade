syntax = "proto3";

package opentrade.event;

import "event/common.proto";

option go_package = "github.com/xargin/opentrade/api/gen/event;event";

// -----------------------------------------------------------------------------
// order-event — Counter → Match. See ADR-0003, 0004, 0005.
//
// Partition key: symbol.
// Each event carries a counter_seq_id so Match can dedup (ADR-0015).
// -----------------------------------------------------------------------------

message OrderEvent {
  EventMeta meta = 1;
  uint64 counter_seq_id = 2;

  oneof payload {
    OrderPlaced placed = 10;
    OrderCancel cancel = 11;
  }
}

message OrderPlaced {
  uint64 user_id = 1;
  uint64 order_id = 2;
  string client_order_id = 3;
  string symbol = 4;
  Side side = 5;
  OrderType order_type = 6;
  TimeInForce tif = 7;
  string price = 8;    // empty for market
  string qty = 9;      // base asset qty; empty for market buy with quote_qty

  // The amount Counter froze for this order. For a protected market buy by
  // base qty (ADR-0083: slippage_bps > 0, qty set, quote_qty empty) this is
  // the user's quote_cap and Match MUST bound execution by
  // effective_limit = min(collar, freeze_cap / qty) so the actual quote
  // spend never exceeds the freeze (INV-1). Informational for other shapes.
  string freeze_cap = 10;

  // Market buy by quote budget (BN-style quoteOrderQty, ADR-0035). Non-empty
  // means: market buy that consumes ask-side liquidity until at most this
  // many quote units have been spent. Mutually exclusive with qty for
  // market buy. Ignored for every other shape.
  string quote_qty = 11;

  // ADR-0075 §1: the perp SymbolConfig version perp-counter admitted this
  // order under. Match cross-validates it against its own catalog cache and
  // rejects on any mismatch (CONFIG_VERSION_TOO_NEW / STALE_ORDER_CONFIG /
  // UNKNOWN_SYMBOL_CONFIG) so the two services never mix config versions
  // inside one order's lifecycle. 0 = spot order (no perp catalog entry) —
  // Match skips the handshake.
  uint64 symbol_config_version = 12;

  // ADR-0083: slippage tolerance in basis points (1 bp = 0.01%). 0 = no
  // protection. >0 is only valid on MARKET orders: Match derives the collar
  // from the opposite best price inside the symbol worker tick
  // (buy: best_ask × (1 + bps/10000), sell: best_bid × (1 − bps/10000)) and
  // executes IOC-style under that bound; empty opposite side rejects with
  // NO_BOOK_REFERENCE.
  uint32 slippage_bps = 13;
}

message OrderCancel {
  uint64 user_id = 1;
  uint64 order_id = 2;
  string symbol = 3;
}
