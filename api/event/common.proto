syntax = "proto3";

package opentrade.event;

option go_package = "github.com/xargin/opentrade/api/gen/event;event";

// -----------------------------------------------------------------------------
// Common enums shared across events
// -----------------------------------------------------------------------------

// Side of an order.
enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

// Order type.
enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
  ORDER_TYPE_STOP = 3;
  ORDER_TYPE_STOP_LIMIT = 4;
}

// Time in force policy.
enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;        // Good till cancel
  TIME_IN_FORCE_IOC = 2;        // Immediate or cancel
  TIME_IN_FORCE_FOK = 3;        // Fill or kill
  TIME_IN_FORCE_POST_ONLY = 4;  // Reject if it would take liquidity
}

// Internal order status (8 states, recorded in journal; see ADR-0020).
enum InternalOrderStatus {
  INTERNAL_ORDER_STATUS_UNSPECIFIED = 0;
  INTERNAL_ORDER_STATUS_PENDING_NEW = 1;
  INTERNAL_ORDER_STATUS_NEW = 2;
  INTERNAL_ORDER_STATUS_PARTIALLY_FILLED = 3;
  INTERNAL_ORDER_STATUS_FILLED = 4;
  INTERNAL_ORDER_STATUS_PENDING_CANCEL = 5;
  INTERNAL_ORDER_STATUS_CANCELED = 6;
  INTERNAL_ORDER_STATUS_REJECTED = 7;
  INTERNAL_ORDER_STATUS_EXPIRED = 8;
}

// Rejection / expiration reasons emitted by Match.
enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  REJECT_REASON_INVALID_PRICE_TICK = 1;
  REJECT_REASON_INVALID_LOT_SIZE = 2;
  REJECT_REASON_POST_ONLY_WOULD_TAKE = 3;
  REJECT_REASON_SELF_TRADE_PREVENTED = 4;
  REJECT_REASON_SYMBOL_NOT_TRADING = 5;
  REJECT_REASON_DUPLICATE_ORDER_ID = 6;
  REJECT_REASON_FOK_NOT_FILLED = 7;
  // ADR-0075 §1 config_version handshake outcomes: the order's stamped
  // symbol_config_version vs Match's local catalog cache.
  REJECT_REASON_CONFIG_VERSION_TOO_NEW = 8;  // local cache older than the order's version
  REJECT_REASON_STALE_ORDER_CONFIG = 9;      // order admitted under an outdated version
  REJECT_REASON_UNKNOWN_SYMBOL_CONFIG = 10;  // symbol absent from the local catalog cache (fail-closed)
  // ADR-0075 §2: the symbol's status machine forbids this operation (e.g.
  // a plain order in POST_ONLY, any new order in CANCEL_ONLY).
  REJECT_REASON_SYMBOL_STATUS_FORBIDS = 11;
  // ADR-0075: limit price outside the SymbolConfig min/max price bounds
  // (Match-side orderbook-scope re-check).
  REJECT_REASON_PRICE_OUT_OF_RANGE = 12;
  // ADR-0083: protected market order arrived while the opposite book side is
  // empty — no reference price to derive the collar from (fail-closed).
  REJECT_REASON_NO_BOOK_REFERENCE = 13;
  REJECT_REASON_INTERNAL = 99;
}

// Perp symbol trading status (ADR-0075 §2). This is THE shared status set:
// the catalog (pkg/perpcfg), perp-counter admission, Match admission, and the
// ADR-0076 delivery flow must all reference this enum so no service invents
// its own state semantics. Delivery states (PRE_DELIVERY / SETTLING /
// SETTLING_HALTED / DELIVERED) are defined now but only exercised once
// ADR-0076 lands; for perpetuals the operational states are PREOPEN /
// TRADING / POST_ONLY / CANCEL_ONLY / DELISTED.
enum PerpSymbolStatus {
  PERP_SYMBOL_STATUS_UNSPECIFIED = 0;
  PERP_SYMBOL_STATUS_PREOPEN = 1;          // query/subscribe only, no trading
  PERP_SYMBOL_STATUS_TRADING = 2;          // place, cancel, match
  PERP_SYMBOL_STATUS_POST_ONLY = 3;        // post-only new orders + cancels
  PERP_SYMBOL_STATUS_CANCEL_ONLY = 4;      // cancels only
  PERP_SYMBOL_STATUS_PRE_DELIVERY = 5;     // reduce-only / cancel / system ops (ADR-0076)
  PERP_SYMBOL_STATUS_SETTLING = 6;         // system ops only (ADR-0076)
  PERP_SYMBOL_STATUS_SETTLING_HALTED = 7;  // settlement dependency unavailable; frozen for admin (ADR-0076)
  PERP_SYMBOL_STATUS_DELIVERED = 8;        // settled; funds/position results only (ADR-0076)
  PERP_SYMBOL_STATUS_DELISTED = 9;         // history queries only
}

// Envelope metadata carried by every event. The producer-specific monotonic
// sequence is NOT carried here — each event type embeds its own typed field
// (counter_seq_id / match_seq_id / quote_seq_id / trigger_seq_id) so the
// producer is unambiguous at the call site. Tag 1 is reserved to prevent
// accidental reuse of the old seq_id field.
message EventMeta {
  reserved 1;
  reserved "seq_id";
  int64 ts_unix_ms = 2;   // event generation time (wall clock, informational only)
  string trace_id = 3;    // end-to-end request trace id
  string producer_id = 4; // e.g. counter-shard-3-main, match-shard-0-main
}
