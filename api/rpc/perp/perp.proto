syntax = "proto3";

package opentrade.rpc.perp;

import "event/common.proto";

option go_package = "github.com/xargin/opentrade/api/gen/rpc/perp;perprpc";

// -----------------------------------------------------------------------------
// perp-counter gRPC service (ADR-0068 §2, A1: independent service). Called by
// BFF (PlaceOrder / Cancel / Query) for USDT-margined linear perpetuals.
// Matching outcome is asynchronous (ADR-0007) — delivered via WS / Query.
//
// The futures margin wallet is funded out-of-band via the asset-service
// funding→futures saga (ADR-0057 biz_line=futures); perp-counter implements
// the AssetHolder contract for that (not on this service surface).
// -----------------------------------------------------------------------------

service PerpService {
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc QueryOrder(QueryOrderRequest) returns (QueryOrderResponse);
  rpc QueryPositions(QueryPositionsRequest) returns (QueryPositionsResponse);
  rpc QueryMargin(QueryMarginRequest) returns (QueryMarginResponse);

  // ADR-0074 account / position config surface. Mutations are idempotent on
  // client_op_id (a repeat returns the first outcome) and run inside the
  // owning user's sequencer.
  rpc SetMarginMode(SetMarginModeRequest) returns (SetMarginModeResponse);
  // ADR-0077 §3: ONE_WAY ↔ HEDGE switch; requires every leg flat, no active
  // orders, no position-bound triggers, no in-flight liquidation.
  rpc SetPositionMode(SetPositionModeRequest) returns (SetPositionModeResponse);
  rpc AdjustIsolatedMargin(AdjustIsolatedMarginRequest) returns (AdjustIsolatedMarginResponse);
  rpc SetAutoAddMargin(SetAutoAddMarginRequest) returns (SetAutoAddMarginResponse);
  rpc SetPositionLeverage(SetPositionLeverageRequest) returns (SetPositionLeverageResponse);
  rpc SetRiskId(SetRiskIdRequest) returns (SetRiskIdResponse);
  rpc QueryPositionConfig(QueryPositionConfigRequest) returns (QueryPositionConfigResponse);
  rpc QueryAccountConfig(QueryAccountConfigRequest) returns (QueryAccountConfigResponse);

  // ADR-0074 §10 admin plane (internal; not routed by the public BFF).
  rpc SetCustomerLeverageLimit(SetCustomerLeverageLimitRequest) returns (SetCustomerLeverageLimitResponse);
  rpc ListCustomerLeverageLimits(ListCustomerLeverageLimitsRequest) returns (ListCustomerLeverageLimitsResponse);

  // ADR-0079 §1 admin plane: per-user fee override (user+symbol row overrides
  // the user-global row, which overrides SymbolConfig.FeeParams). Applies to
  // orders admitted AFTER the change — in-flight orders keep their pinned
  // rates (replay determinism).
  rpc SetCustomerFeeRate(SetCustomerFeeRateRequest) returns (SetCustomerFeeRateResponse);
  rpc ListCustomerFeeRates(ListCustomerFeeRatesRequest) returns (ListCustomerFeeRatesResponse);

  // ADR-0075 §3 risk_reprice_policy dry-run: evaluate every position in
  // symbol under a CANDIDATE risk tier table and report how many accounts
  // would see a higher maintenance requirement / would breach maintenance
  // outright. admin-gateway fans this out across perp shards before letting
  // an IMMEDIATE tightening publish through.
  rpc ProjectRiskConfig(ProjectRiskConfigRequest) returns (ProjectRiskConfigResponse);
}

// MarginMode mirrors perpstate.MarginMode (ADR-0068 §3.1 / ADR-0074).
enum MarginMode {
  MARGIN_MODE_UNSPECIFIED = 0;
  MARGIN_MODE_ISOLATED = 1;
  MARGIN_MODE_CROSS = 2;
}

// PositionMode mirrors perpstate.PositionMode (ADR-0077): ONE_WAY = one net
// position per (user, symbol); HEDGE = independent long/short legs keyed by
// position_idx (1 = long, 2 = short, Bybit-aligned).
enum PositionMode {
  POSITION_MODE_UNSPECIFIED = 0;
  POSITION_MODE_ONE_WAY = 1;
  POSITION_MODE_HEDGE = 2;
}

message PlaceOrderRequest {
  uint64 user_id = 1;
  string client_order_id = 2;                 // optional idempotency key
  string symbol = 3;                          // e.g. BTC-USDT-PERP
  opentrade.event.Side side = 4;
  opentrade.event.OrderType order_type = 5;
  opentrade.event.TimeInForce tif = 6;
  string price = 7;                           // empty for market
  string qty = 8;                             // base qty
  string leverage = 9;                        // decimal, e.g. "10"
  bool reduce_only = 10;                      // close-only; never increases a position
  MarginMode margin_mode = 11;                // MVP: ISOLATED
  // ADR-0077 §2 position intent, fail-closed both ways: must be 0 in
  // ONE_WAY mode; must be 1 (long leg) or 2 (short leg) in HEDGE mode, with
  // (side, position_idx, reduce_only) agreeing per the admission matrix.
  uint32 position_idx = 12;
  // ADR-0083: slippage tolerance in basis points (1 bp = 0.01%), only valid
  // on MARKET orders, range (0, 10000]. IM for a protected market buy is
  // reserved at mark × (1 + bps/10000); sells stay at mark.
  uint32 slippage_bps = 13;
}

message PlaceOrderResponse {
  uint64 order_id = 1;
  string client_order_id = 2;
  bool accepted = 3;                          // false = dedup hit or rejected
  string reject_reason = 4;                   // e.g. "insufficient_margin"
  int64 received_ts_unix_ms = 5;
}

message CancelOrderRequest {
  uint64 user_id = 1;
  uint64 order_id = 2;
}

message CancelOrderResponse {
  uint64 order_id = 1;
  bool accepted = 2;
}

message QueryOrderRequest {
  uint64 user_id = 1;
  uint64 order_id = 2;
}

message QueryOrderResponse {
  uint64 order_id = 1;
  string client_order_id = 2;
  string symbol = 3;
  opentrade.event.Side side = 4;
  opentrade.event.OrderType order_type = 5;
  opentrade.event.TimeInForce tif = 6;
  string price = 7;
  string qty = 8;
  string filled_qty = 9;
  bool reduce_only = 10;
  opentrade.event.InternalOrderStatus status = 11;
  int64 created_at_unix_ms = 12;
  int64 updated_at_unix_ms = 13;
}

message QueryPositionsRequest {
  uint64 user_id = 1;
  string symbol = 2; // empty = all symbols
}

message QueryPositionsResponse {
  repeated Position positions = 1;
}

// Position is the query view; size/entry/margin are authoritative state,
// while mark_price / unrealized_pnl / liq_price / margin_ratio are derived
// at query time from the latest mark (ADR-0068 invariant #2).
message Position {
  string symbol = 1;
  opentrade.event.Side side = 2;
  string size = 3;
  string entry_price = 4;
  string margin = 5;          // isolated margin; "0" for cross (equity lives in the pool)
  string leverage = 6;
  MarginMode margin_mode = 7;
  string mark_price = 8;
  string unrealized_pnl = 9;
  string realized_pnl = 10;
  string liq_price = 11;      // isolated only; cross liquidation is pool-level (ADR-0074 §4 rule #6)
  string margin_ratio = 12;
  uint32 risk_id = 13;        // selected risk tier (0 = auto)
  uint32 position_idx = 14;   // ADR-0077: 0 = net, 1 = hedge long, 2 = hedge short
  PositionMode position_mode = 15; // the symbol's mode this leg belongs to
}

message QueryMarginRequest {
  uint64 user_id = 1;
}

// QueryMarginResponse separates persisted ledger buckets from derived risk
// values (ADR-0074 §2): free_balance / order_margin_reserved /
// isolated_margin_locked are journaled cash; the cross_* fields and the
// available_* fields are computed from positions + marks + risk tiers at
// query time and never appear as money movements in the journal.
message QueryMarginResponse {
  string asset = 1;                      // "USDT"
  string free_balance = 2;               // cash not locked by isolated margin or order reservations
  string order_margin_reserved = 3;      // IM held against open orders (ADR-0041 reservation)
  string isolated_margin_locked = 4;     // Σ isolated position.margin (positions are authoritative)
  string isolated_unrealized_pnl = 5;    // derived: Σ isolated uPnL at mark
  string cross_unrealized_pnl = 6;       // derived: Σ cross uPnL at mark
  string cross_initial_required = 7;     // derived: cross pool IM requirement
  string cross_maintenance_required = 8; // derived: cross pool MM requirement
  string available_to_trade = 9;         // derived: free + min(cross uPnL, 0) - cross IM requirement
  string available_to_withdraw = 10;     // derived: max(0, min(free_balance, available_to_trade))
}

// --- ADR-0074 config ops ------------------------------------------------

message SetMarginModeRequest {
  uint64 user_id = 1;
  string symbol = 2;
  MarginMode target_mode = 3;
  string target_margin = 4;   // cross→isolated only: requested isolated margin (decimal, optional)
  string client_op_id = 5;
}

message SetMarginModeResponse {
  bool accepted = 1;
  string reject_reason = 2;
  MarginMode margin_mode = 3;     // post-op mode
  string position_margin = 4;     // post-op isolated margin (hedge: summed across legs; "0" for cross)
  string free_balance_after = 5;
}

// --- ADR-0077 position mode -----------------------------------------------

message SetPositionModeRequest {
  uint64 user_id = 1;
  string symbol = 2;          // per-(user, symbol); no account-level form (ADR-0077 修订 #1)
  PositionMode target_mode = 3;
  string client_op_id = 4;
}

message SetPositionModeResponse {
  bool accepted = 1;
  string reject_reason = 2;   // active_orders_cancel_first / active_triggers_cancel_first / liquidation_in_flight / position_not_flat
  PositionMode position_mode = 3; // post-op mode
}

message AdjustIsolatedMarginRequest {
  uint64 user_id = 1;
  string symbol = 2;
  string delta = 3;           // signed decimal: >0 add from free balance, <0 remove to free balance
  string client_op_id = 4;
  // ADR-0077 §7: the only per-leg config op. Must be 0 in ONE_WAY mode and
  // 1/2 in HEDGE mode (fail-closed both ways).
  uint32 position_idx = 5;
}

message AdjustIsolatedMarginResponse {
  bool accepted = 1;
  string reject_reason = 2;
  string position_margin = 3;
  string free_balance_after = 4;
}

message SetAutoAddMarginRequest {
  uint64 user_id = 1;
  string symbol = 2;
  bool enabled = 3;
  string max_add_per_event = 4; // decimal, "0"/empty = uncapped
  string client_op_id = 5;
}

message SetAutoAddMarginResponse {
  bool accepted = 1;
  string reject_reason = 2;
}

message SetPositionLeverageRequest {
  uint64 user_id = 1;
  string symbol = 2;
  string leverage = 3;        // decimal > 0
  string client_op_id = 4;
}

message SetPositionLeverageResponse {
  bool accepted = 1;
  string reject_reason = 2;
  string leverage = 3;            // post-op configured leverage
  string position_margin = 4;     // post-op isolated margin (resized by the change)
  string free_balance_after = 5;
}

message SetRiskIdRequest {
  uint64 user_id = 1;
  string symbol = 2;
  uint32 risk_id = 3;         // 1-based tier index; 0 = auto
  string client_op_id = 4;
}

message SetRiskIdResponse {
  bool accepted = 1;
  string reject_reason = 2;
  uint32 risk_id = 3;
}

message QueryPositionConfigRequest {
  uint64 user_id = 1;
  string symbol = 2;          // empty = all symbols with a config or position
}

// PositionConfig is the per-(user, symbol, position_idx) view (ADR-0074
// glossary + ADR-0077: one row per existing leg; margin mode / leverage /
// risk_id are uniform across a symbol's legs per ADR-0077 §7). The
// effective_* fields are derived from tier table + customer cap at query time.
message PositionConfig {
  string symbol = 1;
  MarginMode margin_mode = 2;
  string leverage = 3;
  uint32 risk_id = 4;
  bool auto_add_margin = 5;
  string auto_add_max = 6;
  string effective_max_leverage = 7; // min(tier cap, customer cap, product default)
  string max_notional = 8;           // selected risk tier's notional cap ("0" = uncapped)
  uint32 position_idx = 9;           // ADR-0077
  PositionMode position_mode = 10;   // the symbol's mode
}

message QueryPositionConfigResponse {
  repeated PositionConfig configs = 1;
}

message QueryAccountConfigRequest {
  uint64 user_id = 1;
}

// AccountConfig is the account-level view. risk_model is reserved plumbing
// for ADR-0074 §12 (portfolio margin replaces the pool risk model, not the
// account topology); only STANDARD is implemented.
message QueryAccountConfigResponse {
  string settle_asset = 1;        // "USDT"
  string risk_model = 2;          // STANDARD | PORTFOLIO (reserved)
  string cross_pool_id = 3;       // "cross:{user_id}:USDT"
  repeated CustomerLeverageLimit leverage_limits = 4; // caps applying to this user
}

// --- ADR-0074 §10 admin plane -------------------------------------------

message CustomerLeverageLimit {
  uint64 user_id = 1;
  string symbol = 2;          // empty = all symbols
  string max_leverage = 3;    // decimal
  string reason = 4;
  string updated_by = 5;
  int64 updated_at_unix_ms = 6;
}

message SetCustomerLeverageLimitRequest {
  uint64 user_id = 1;
  string symbol = 2;          // empty = user-global cap
  string max_leverage = 3;    // decimal; "0" removes the cap
  string reason = 4;
  string updated_by = 5;
}

message SetCustomerLeverageLimitResponse {
  bool accepted = 1;
  string reject_reason = 2;
}

message ListCustomerLeverageLimitsRequest {
  uint64 user_id = 1;         // 0 = all users
}

message ListCustomerLeverageLimitsResponse {
  repeated CustomerLeverageLimit limits = 1;
}

// --- ADR-0079 §1 admin plane: per-user fee overrides ----------------------

message CustomerFeeRate {
  uint64 user_id = 1;
  string symbol = 2;          // empty = all symbols
  string fee_rule_id = 3;
  string maker_fee_rate = 4;  // signed decimal; < 0 = rebate
  string taker_fee_rate = 5;  // decimal, >= 0
  string reason = 6;
  string updated_by = 7;
  int64 updated_at_unix_ms = 8;
}

message SetCustomerFeeRateRequest {
  uint64 user_id = 1;
  string symbol = 2;          // empty = user-global override
  string fee_rule_id = 3;     // empty = remove the override row
  string maker_fee_rate = 4;  // signed decimal; <= taker_fee_rate
  string taker_fee_rate = 5;  // decimal in [0, 1)
  string reason = 6;
  string updated_by = 7;
}

message SetCustomerFeeRateResponse {
  bool accepted = 1;
  string reject_reason = 2;
}

message ListCustomerFeeRatesRequest {
  uint64 user_id = 1;         // 0 = all users
}

message ListCustomerFeeRatesResponse {
  repeated CustomerFeeRate fee_rates = 1;
}

// ADR-0075 §3 dry-run projection.
message RiskTierParam {
  uint32 risk_id = 1;
  string max_notional = 2;             // decimal; "0" = open-ended final tier
  string maintenance_margin_ratio = 3; // decimal
  string max_leverage = 4;             // decimal
  string liq_fee_rate = 5;             // decimal
}

message ProjectRiskConfigRequest {
  string symbol = 1;
  repeated RiskTierParam risk_tiers = 2; // the CANDIDATE table
}

message ProjectRiskConfigResponse {
  // Accounts holding a position in symbol whose maintenance requirement
  // would INCREASE under the candidate table.
  uint64 affected_accounts = 1;
  // Accounts whose position / cross pool would breach maintenance outright
  // at current marks — the would-be batch liquidation set.
  uint64 liquidatable_accounts = 2;
  // Accounts holding any position in symbol (context for the two counts).
  uint64 positions_scanned = 3;
}
