syntax = "proto3";

package opentrade.rpc.history;

import "event/common.proto";
import "rpc/trigger/trigger.proto";

option go_package = "github.com/xargin/opentrade/api/gen/rpc/history;historyrpc";

// -----------------------------------------------------------------------------
// History service — read-only queries over the trade-dump MySQL projection
// (ADR-0046, draft).
//
// Authority model:
//   Kafka remains the source of truth (ADR-0001). trade-dump projects
//   counter-journal + trade-event into `orders` / `trades` / `account_logs`
//   (ADR-0023 / ADR-0028). History is a pure read-side service over those
//   tables; it consumes no Kafka and holds no business state. Scaling out
//   means adding stateless replicas with a MySQL read-replica DSN.
//
// Lag model:
//   trade-dump commits MySQL before advancing Kafka offsets (ADR-0023),
//   so the projection is at-most one batch behind the live journal.
//   For live fill progress clients SHOULD keep listening on the Push
//   `user` stream (ADR-0007); History is for after-the-fact browsing.
//
// Hot / cold split:
//   Counter still serves `QueryOrder` for active orders so BFF can keep
//   its existing `GET /v1/order/:id` hot-path. History.GetOrder is the
//   canonical lookup once the order hits a terminal state and is
//   evicted from Counter memory.
// -----------------------------------------------------------------------------

service HistoryService {
  // GetOrder returns one order by id. Works for both active and terminal
  // orders once trade-dump has projected the row. NOT_FOUND until the
  // FreezeEvent row lands; PermissionDenied if user_id does not match.
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);

  // ListOrders pages a user's orders, newest first by created_at.
  // All filter fields are optional; empty = no filter on that column.
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);

  // ListTrades pages a user's fills (maker or taker), newest first by ts.
  rpc ListTrades(ListTradesRequest) returns (ListTradesResponse);

  // ListAccountLogs pages a user's funds-flow journal rows (`account_logs`),
  // newest first by ts.
  rpc ListAccountLogs(ListAccountLogsRequest) returns (ListAccountLogsResponse);

  // -- Perp (USDT-margined futures) history, ADR-0068 M7. Read-side over the
  //    trade-dump perp_* projection (03-perp-schema.sql). --

  // ListPerpPositions returns a user's current positions (state, not paged).
  rpc ListPerpPositions(ListPerpPositionsRequest) returns (ListPerpPositionsResponse);

  // ListPerpFunding pages a user's funding payments, newest first by ts.
  rpc ListPerpFunding(ListPerpFundingRequest) returns (ListPerpFundingResponse);

  // ListPerpLiquidations pages a user's liquidation events, newest first by ts.
  rpc ListPerpLiquidations(ListPerpLiquidationsRequest) returns (ListPerpLiquidationsResponse);

  // ListPerpADL pages a user's ADL forced-close events, newest first by ts.
  rpc ListPerpADL(ListPerpADLRequest) returns (ListPerpADLResponse);

  // ListPerpMarginAdjustments pages a user's isolated-margin movements
  // (manual add/remove, mode-switch cash leg, auto-add, leverage resize —
  // ADR-0074 §6/§7), newest first by ts.
  rpc ListPerpMarginAdjustments(ListPerpMarginAdjustmentsRequest) returns (ListPerpMarginAdjustmentsResponse);

  // ListPerpConfigLogs pages a user's position-config change history
  // (margin mode / leverage / risk_id / auto-add, ADR-0074 §13), newest
  // first by ts.
  rpc ListPerpConfigLogs(ListPerpConfigLogsRequest) returns (ListPerpConfigLogsResponse);

  // ListPerpSettlements pages a user's fills with fee attribution
  // (ADR-0079: the perp_settlements row is also the fee ledger), newest
  // first by ts.
  rpc ListPerpSettlements(ListPerpSettlementsRequest) returns (ListPerpSettlementsResponse);

  // ListPerpDailyStats pages a user's per-(symbol, UTC day) aggregates —
  // trading fee / rebate / funding / realized PnL (ADR-0079 §6), newest
  // first by stat_date.
  rpc ListPerpDailyStats(ListPerpDailyStatsRequest) returns (ListPerpDailyStatsResponse);

  // GetTrigger returns one trigger by id from the long-term
  // projection (ADR-0047). Use this for looking up a trigger after
  // it has aged out of the trigger service's in-memory terminal
  // buffer. The trigger service is still authoritative for active
  // PENDING records.
  rpc GetTrigger(GetTriggerRequest) returns (GetTriggerResponse);

  // ListTriggers pages a user's triggers, newest first by
  // created_at. Scope filter covers "active" (PENDING) and "terminal"
  // (TRIGGERED / CANCELED / REJECTED / EXPIRED) buckets plus ALL.
  rpc ListTriggers(ListTriggersRequest) returns (ListTriggersResponse);

  // Transfer history moved to asset-service (ADR-0065). See
  // AssetService.ListTransfers / QueryTransfer.
}

// -----------------------------------------------------------------------------
// Pagination (shared across List* RPCs)
//
// Cursors are opaque strings produced and consumed only by this service;
// clients MUST NOT parse or construct them. An empty request cursor means
// "start from the newest row"; an empty response next_cursor means "no
// more rows". limit=0 is replaced by a server default (100); the server
// clamps to HistoryListLimitMax (500). Time windows are [since_ms, until_ms)
// with 0 on either bound meaning open-ended.
// -----------------------------------------------------------------------------

// -----------------------------------------------------------------------------
// Orders
// -----------------------------------------------------------------------------

message GetOrderRequest {
  uint64 user_id = 1;
  uint64 order_id = 2;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  uint64 user_id = 1;
  string symbol = 2;                        // "" = any
  // Coarse category filter covering the two common UI tabs:
  //   OPEN     → NEW + PARTIALLY_FILLED   ("open orders" / 未完成)
  //   TERMINAL → FILLED + CANCELED + REJECTED + EXPIRED  ("order history" / 已完结)
  //   ALL      → no status filter
  // UNSPECIFIED is treated as ALL (client convenience; default-zero stays
  // functional). If `statuses` is also non-empty it wins and `scope` is
  // ignored — use one or the other.
  OrderScope scope = 3;
  // Fine-grained status filter. Empty = rely on `scope`.
  repeated OrderStatus statuses = 4;
  int64 since_ms = 5;                       // created_at lower bound, 0 = open
  int64 until_ms = 6;                       // created_at upper bound, 0 = open
  string cursor = 7;
  int32 limit = 8;
}

// OrderScope is the coarse two-tab filter for ListOrders. See comment on
// ListOrdersRequest.scope for the exact status folding.
enum OrderScope {
  ORDER_SCOPE_UNSPECIFIED = 0;  // == ALL
  ORDER_SCOPE_OPEN = 1;
  ORDER_SCOPE_TERMINAL = 2;
  ORDER_SCOPE_ALL = 3;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  string next_cursor = 2;
}

// Order mirrors the `orders` projection row. `status` is the external 6-state
// view (ADR-0020); the internal 8-state machine is folded on the read side so
// the API contract stays stable across internal refactors.
message Order {
  uint64 order_id = 1;
  string client_order_id = 2;
  uint64 user_id = 3;
  string symbol = 4;
  opentrade.event.Side side = 5;
  opentrade.event.OrderType order_type = 6;
  opentrade.event.TimeInForce tif = 7;
  string price = 8;                         // 0 for MARKET orders
  string qty = 9;                           // 0 for MARKET buy with quote_qty
  string filled_qty = 10;
  string frozen_amt = 11;                   // Initial FreezeEvent amount
  OrderStatus status = 12;
  string reject_reason = 13;                // populated only on REJECTED
  int64 created_at_unix_ms = 14;
  int64 updated_at_unix_ms = 15;
}

// OrderStatus is the Binance-compatible external 6-state view (ADR-0020).
// Internal PENDING_* are folded: PENDING_NEW→NEW, PENDING_CANCEL preserves
// the pre-cancel state visible to the client.
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_NEW = 1;
  ORDER_STATUS_PARTIALLY_FILLED = 2;
  ORDER_STATUS_FILLED = 3;
  ORDER_STATUS_CANCELED = 4;
  ORDER_STATUS_REJECTED = 5;
  ORDER_STATUS_EXPIRED = 6;
}

// -----------------------------------------------------------------------------
// Trades
// -----------------------------------------------------------------------------

message ListTradesRequest {
  uint64 user_id = 1;
  string symbol = 2;                        // "" = any
  int64 since_ms = 3;
  int64 until_ms = 4;
  string cursor = 5;
  int32 limit = 6;
}

message ListTradesResponse {
  repeated Trade trades = 1;
  string next_cursor = 2;
}

// Trade is the requesting user's view of a fill. The counterparty is not
// exposed — only which role the user played and their own order id.
message Trade {
  string trade_id = 1;
  string symbol = 2;
  string price = 3;
  string qty = 4;
  TradeRole role = 5;                       // MAKER vs TAKER for this user
  uint64 order_id = 6;                      // user's own order id
  opentrade.event.Side side = 7;            // user's side on this fill
  int64 ts_unix_ms = 8;
}

enum TradeRole {
  TRADE_ROLE_UNSPECIFIED = 0;
  TRADE_ROLE_MAKER = 1;
  TRADE_ROLE_TAKER = 2;
}

// -----------------------------------------------------------------------------
// Account logs (funds-flow journal)
// -----------------------------------------------------------------------------

message ListAccountLogsRequest {
  uint64 user_id = 1;
  string asset = 2;                         // "" = any
  // Free-form biz_type filter matching the strings written by trade-dump:
  // "freeze_place_order", "unfreeze", "settlement", "deposit", "withdraw",
  // "freeze", "unfreeze". Empty = any.
  repeated string biz_types = 3;
  int64 since_ms = 4;
  int64 until_ms = 5;
  string cursor = 6;
  int32 limit = 7;
}

message ListAccountLogsResponse {
  repeated AccountLog logs = 1;
  string next_cursor = 2;
}

// -----------------------------------------------------------------------------
// Triggers (long-term history, ADR-0047)
// -----------------------------------------------------------------------------

message GetTriggerRequest {
  uint64 user_id = 1;
  uint64 id = 2;
}

message GetTriggerResponse {
  Trigger trigger = 1;
}

message ListTriggersRequest {
  uint64 user_id = 1;
  string symbol = 2;                              // "" = any
  // Coarse category filter. ACTIVE folds PENDING, TERMINAL folds
  // TRIGGERED + CANCELED + REJECTED + EXPIRED, ALL disables the filter.
  // UNSPECIFIED is treated as ALL. Exclusive with `statuses`.
  TriggerScope scope = 3;
  repeated opentrade.rpc.trigger.TriggerStatus statuses = 4;
  int64 since_ms = 5;
  int64 until_ms = 6;
  string cursor = 7;
  int32 limit = 8;
}

message ListTriggersResponse {
  repeated Trigger triggers = 1;
  string next_cursor = 2;
}

enum TriggerScope {
  TRIGGER_SCOPE_UNSPECIFIED = 0; // == ALL
  TRIGGER_SCOPE_ACTIVE = 1;      // PENDING
  TRIGGER_SCOPE_TERMINAL = 2;    // TRIGGERED + CANCELED + REJECTED + EXPIRED
  TRIGGER_SCOPE_ALL = 3;
}

// Trigger is the long-term view served by history. Field layout
// mirrors trigger.Trigger (rpc/trigger.proto) so clients that
// already know that shape reuse it verbatim.
message Trigger {
  uint64 id = 1;
  string client_trigger_id = 2;
  uint64 user_id = 3;
  string symbol = 4;
  opentrade.event.Side side = 5;
  opentrade.rpc.trigger.TriggerType type = 6;
  string stop_price = 7;
  string limit_price = 8;
  string qty = 9;
  string quote_qty = 10;
  opentrade.event.TimeInForce tif = 11;
  opentrade.rpc.trigger.TriggerStatus status = 12;
  uint64 triggered_order_id = 13;
  string reject_reason = 14;
  int64 expires_at_unix_ms = 15;
  string oco_group_id = 16;
  int32 trailing_delta_bps = 17;
  string activation_price = 18;
  string trailing_watermark = 19;
  bool trailing_active = 20;
  int64 created_at_unix_ms = 21;
  int64 triggered_at_unix_ms = 22;
}

// AccountLog mirrors the `account_logs` projection row.
message AccountLog {
  int32 shard_id = 1;
  uint64 counter_seq_id = 2;
  string asset = 3;
  uint64 user_id = 4;
  string delta_avail = 5;
  string delta_frozen = 6;
  string avail_after = 7;
  string frozen_after = 8;
  string biz_type = 9;
  string biz_ref_id = 10;
  int64 ts_unix_ms = 11;
}

// -----------------------------------------------------------------------------
// Perp history (ADR-0068 M7) — over trade-dump's perp_* tables.
// -----------------------------------------------------------------------------

message ListPerpPositionsRequest {
  uint64 user_id = 1;
  string symbol = 2; // "" = all symbols
}

message ListPerpPositionsResponse {
  repeated PerpPosition positions = 1;
}

// PerpPosition mirrors the `perp_positions` projection row.
message PerpPosition {
  uint64 user_id = 1;
  string symbol = 2;
  opentrade.event.Side side = 3;
  string size = 4;
  string entry_price = 5;
  string margin = 6;
  string leverage = 7;
  string realized_pnl = 8;
  int64 updated_at_unix_ms = 9;
  uint32 position_idx = 10; // ADR-0077: 0 net / 1 hedge long / 2 hedge short
}

message ListPerpFundingRequest {
  uint64 user_id = 1;
  string symbol = 2; // "" = any
  int64 since_ms = 3;
  int64 until_ms = 4;
  string cursor = 5;
  int32 limit = 6;
}

message ListPerpFundingResponse {
  repeated PerpFunding funding = 1;
  string next_cursor = 2;
}

// PerpFunding mirrors the `perp_funding` projection row.
message PerpFunding {
  uint64 perp_seq_id = 1;
  string symbol = 2;
  string funding_round_id = 3;
  string funding_rate = 4;
  string mark_price = 5;
  string payment = 6; // signed; negative = the position paid
  int64 ts_unix_ms = 7;
  uint32 position_idx = 8; // ADR-0077 per-leg funding
}

message ListPerpSettlementsRequest {
  uint64 user_id = 1;
  string symbol = 2; // "" = any
  int64 since_ms = 3;
  int64 until_ms = 4;
  string cursor = 5;
  int32 limit = 6;
}

message ListPerpSettlementsResponse {
  repeated PerpSettlement settlements = 1;
  string next_cursor = 2;
}

// PerpSettlement mirrors the `perp_settlements` projection row — one fill
// with its ADR-0079 fee attribution.
message PerpSettlement {
  uint64 perp_seq_id = 1;
  uint64 order_id = 2;
  string trade_id = 3;
  string symbol = 4;
  uint32 position_idx = 5;
  int32 fill_side = 6;
  string price = 7;
  string qty = 8;
  string realized_pnl = 9;     // pre-fee
  string fee = 10;             // signed: > 0 paid, < 0 rebate received
  string margin_added = 11;
  string margin_released = 12;
  int32 liquidity_role = 13;   // 1 maker / 2 taker
  string fee_rule_id = 14;
  string fee_rate = 15;
  string fee_asset = 16;
  string fee_deficit = 17;
  bool rebate_suppressed = 18;
  int64 ts_unix_ms = 19;
}

message ListPerpDailyStatsRequest {
  uint64 user_id = 1;
  string symbol = 2;  // "" = any
  int64 since_ms = 3; // filters stat_date (UTC day start), 0 = unbounded
  int64 until_ms = 4;
  string cursor = 5;
  int32 limit = 6;
}

message ListPerpDailyStatsResponse {
  repeated PerpDailyStat stats = 1;
  string next_cursor = 2;
}

// PerpDailyStat joins the three ADR-0079 §6 daily tables on
// (user_id, symbol, stat_date); absent rows contribute zeros.
message PerpDailyStat {
  string symbol = 1;
  string stat_date = 2;        // "YYYY-MM-DD" (UTC day)
  string trading_fee = 3;      // Σ positive fees charged
  string rebate = 4;           // Σ rebates received (positive number)
  string fee_deficit = 5;      // Σ uncollectable fee
  string funding_paid = 6;     // Σ |negative funding payments|
  string funding_received = 7; // Σ positive funding payments
  string realized_pnl = 8;     // Σ trade-close realized (settle + liq + ADL; funding excluded)
}

message ListPerpMarginAdjustmentsRequest {
  uint64 user_id = 1;
  string symbol = 2; // "" = any
  int64 since_ms = 3;
  int64 until_ms = 4;
  string cursor = 5;
  int32 limit = 6;
}

message ListPerpMarginAdjustmentsResponse {
  repeated PerpMarginAdjustment adjustments = 1;
  string next_cursor = 2;
}

// PerpMarginAdjustment mirrors the `perp_margin_adjustments` projection row.
message PerpMarginAdjustment {
  uint64 perp_seq_id = 1;
  string symbol = 2;
  int32 kind = 3;            // PerpMarginAdjustmentEvent.Kind
  string amount = 4;
  string margin_before = 5;
  string margin_after = 6;
  string wallet_after = 7;
  uint64 position_version = 8;
  string client_op_id = 9;
  string mark_price = 10;
  int64 ts_unix_ms = 11;
  uint32 position_idx = 12; // ADR-0077: the leg whose margin moved
}

message ListPerpConfigLogsRequest {
  uint64 user_id = 1;
  string symbol = 2; // "" = any
  int64 since_ms = 3;
  int64 until_ms = 4;
  string cursor = 5;
  int32 limit = 6;
}

message ListPerpConfigLogsResponse {
  repeated PerpConfigLog logs = 1;
  string next_cursor = 2;
}

// PerpConfigLog mirrors the `perp_position_config_logs` projection row.
message PerpConfigLog {
  uint64 perp_seq_id = 1;
  string symbol = 2;
  int32 margin_mode = 3;     // 1 isolated / 2 cross
  string leverage = 4;
  uint32 risk_id = 5;
  bool auto_add_margin = 6;
  string auto_add_max = 7;
  uint64 position_version = 8;
  string reason = 9;
  string client_op_id = 10;
  int64 ts_unix_ms = 11;
  int32 position_mode = 12; // ADR-0077: 1 one-way / 2 hedge
  uint32 position_idx = 13;
}

message ListPerpLiquidationsRequest {
  uint64 user_id = 1;
  string symbol = 2; // "" = any
  int64 since_ms = 3;
  int64 until_ms = 4;
  string cursor = 5;
  int32 limit = 6;
}

message ListPerpLiquidationsResponse {
  repeated PerpLiquidation liquidations = 1;
  string next_cursor = 2;
}

// PerpLiquidation mirrors the `perp_liquidations` projection row.
message PerpLiquidation {
  uint64 perp_seq_id = 1;
  string symbol = 2;
  uint64 liq_order_id = 3;
  string bankruptcy_price = 4;
  string mark_price = 5;
  string closed_qty = 6;
  string realized_pnl = 7;
  string insurance_delta = 8;
  bool adl_queued = 9;
  int64 ts_unix_ms = 10;
  uint32 position_idx = 11; // ADR-0077 liquidated leg
}

message ListPerpADLRequest {
  uint64 user_id = 1;
  string symbol = 2; // "" = any
  int64 since_ms = 3;
  int64 until_ms = 4;
  string cursor = 5;
  int32 limit = 6;
}

message ListPerpADLResponse {
  repeated PerpADL adl = 1;
  string next_cursor = 2;
}

// PerpADL mirrors the `perp_adl_events` projection row.
message PerpADL {
  uint64 perp_seq_id = 1;
  string symbol = 2;
  string lot_id = 3;
  uint64 adl_round = 4;
  string price = 5;
  string requested_qty = 6;
  string fact_qty = 7;
  string realized_pnl = 8;
  int64 ts_unix_ms = 9;
  uint32 position_idx = 10; // ADR-0077 reduced leg
}
